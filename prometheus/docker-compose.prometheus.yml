services:
  selfish_prometheus:
    image: prom/prometheus:v3.12.0-distroless
    container_name: selfish_prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - selfish_prometheus_data:/prometheus
    depends_on:
      - selfish_cadvisor
    networks:
      - selfish-network

  selfish_cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.54.1
    container_name: selfish_cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - selfish-network

volumes:
  selfish_prometheus_data: {}
