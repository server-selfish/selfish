services:
  selfish-gateway:
    image: nginx:1.28.0-alpine-slim
    container_name: selfish-gateway
    ports:
      - "8080:443"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/cert/server.crt:/etc/nginx/ssl/server.crt:ro
      - ./gateway/cert/server.key:/etc/nginx/ssl/server.key:ro
    restart: unless-stopped
    depends_on:
      selfish-backend:
        condition: service_started
      selfish-frontend:
        condition: service_started
    networks:
      - selfish-network
