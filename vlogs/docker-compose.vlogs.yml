services:
  selfish_logs:
    container_name: selfish-vlogs
    image: victoriametrics/victoria-logs:v1.50.0
    ports:
      - "9428:9428"
    command:
      - "--storageDataPath=/vlogs"
    volumes:
      - selfish_logs_data:/vlogs
    restart: unless-stopped
    networks:
      - selfish-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9428"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  selfish_logs_data: {}
